<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIDS · Supervision and contact boundaries</title>
<style>
@font-face{font-family:'Flame';src:url('fonts/Flame-Bold.otf');font-weight:700}
@font-face{font-family:'Flame Sans';src:url('fonts/FlameSans-Regular.otf');font-weight:400}
:root{--red:#D62300;--orange:#F58538;--brown:#502314;--mayo:#F5EBDC;--yel:#FFC72C;--green:#2E7D4F;--ink:#502314;--muted:#8a6a58}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2b1209}
body{font-family:'Flame Sans','Noto Sans Devanagari','Nirmala UI',sans-serif;color:var(--ink);display:flex;justify-content:center;overflow:hidden}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.d{font-family:'Flame','Noto Sans Devanagari','Nirmala UI',sans-serif;font-weight:700}
#app{position:relative;width:100%;max-width:480px;height:100%;background:var(--mayo);display:flex;flex-direction:column;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--red);color:#fff}
header .t{flex:1;min-width:0;font-size:15px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{flex:none;display:flex;background:rgba(255,255,255,.2);border-radius:20px;padding:3px}
.lang button{padding:6px 11px;border-radius:16px;font-size:13px;font-weight:700;color:#fff}
.lang button.on{background:#fff;color:var(--red)}
.prog{flex:none;height:5px;background:#e9d6bc}.prog i{display:block;height:100%;background:var(--yel);width:0;transition:width .4s}
main{flex:1;min-height:0;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px;gap:14px;overflow:auto}
h1{font-size:30px;line-height:1.05;color:var(--red)}
h2{font-size:24px;line-height:1.1;color:var(--brown)}
.sub{font-size:15px;color:var(--muted);line-height:1.35}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--red);color:#fff;font-size:19px;text-align:center;box-shadow:0 5px 0 #8f1700}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8f1700}
.btn.sec{background:#fff;color:var(--red);box-shadow:0 5px 0 #e2c9ae}
.btn[disabled]{opacity:.45;pointer-events:none}
.tiles{display:flex;gap:10px}.tile{flex:1;background:#fff;border-radius:16px;padding:14px;text-align:center}
.tile b{display:block;font-size:28px;color:var(--red)}.tile span{font-size:13px;color:var(--muted)}
.hero{flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--red);border-radius:24px;color:#fff;text-align:center;padding:20px;gap:8px}
.hero .k{font-size:76px;letter-spacing:.06em;line-height:1}
.langpick{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--muted)}
.langpick .lang{background:#fff;border:2px solid #ead7c2}.langpick .lang button{color:var(--muted);padding:9px 16px;font-size:15px}.langpick .lang button.on{background:var(--red);color:#fff}
/* video */
.vwrap{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
.vwrap video{width:100%;height:100%;object-fit:contain;background:#000}
.tapplay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.45);color:#fff;font-size:18px}
.tapplay.show{display:flex}.tapplay .pb{width:84px;height:84px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center}
.vbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.circ{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;flex:none}
.vbar .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}.vbar .bar i{display:block;height:100%;width:0;background:var(--yel)}
.vbar .nx{flex:none;padding:12px 18px;border-radius:24px;background:var(--red);color:#fff;font-size:16px}
.vbar .nx[disabled]{background:#777;color:#ddd}
.vhint{position:absolute;top:10px;left:10px;right:10px;text-align:center;font-size:13px;color:#fff;background:rgba(0,0,0,.5);border-radius:12px;padding:6px 10px}
/* art */
.art{position:relative;width:100%;aspect-ratio:1/1;background:var(--mayo);border-radius:18px;overflow:hidden}
.art .ab{position:absolute}.art .ab svg{display:block}
.bub{position:absolute;background:#fff;border:3px solid var(--brown);border-radius:16px;padding:4px 6px;text-align:center;font-family:'Flame',sans-serif;font-size:clamp(14px,4vw,20px);color:var(--brown)}
.qm{font-family:'Flame',sans-serif;font-size:clamp(50px,16vw,90px);color:var(--orange)}
/* round 1 */
.roundhd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}.roundhd .n{font-size:14px;color:var(--muted);flex:none}
.deck{position:relative;flex:1;min-height:300px;display:flex;align-items:center;justify-content:center}
.card{position:absolute;width:min(100%,360px);background:#fff;border-radius:24px;padding:14px;box-shadow:0 10px 24px rgba(80,35,20,.18);touch-action:none;user-select:none;transition:transform .35s ease,opacity .35s}
.card .ct{font-size:20px;line-height:1.15;text-align:center;margin-top:10px;color:var(--brown)}
.card .tag{position:absolute;top:22px;padding:6px 14px;border:4px solid;border-radius:12px;font-size:24px;opacity:0;transform:rotate(-12deg)}
.card .tag.y{left:20px;color:var(--green);border-color:var(--green)}.card .tag.n{right:20px;color:var(--red);border-color:var(--red);transform:rotate(12deg)}
.choices{display:flex;gap:12px}.choices button{flex:1;padding:16px 8px;border-radius:16px;font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.choices .no{background:var(--red);box-shadow:0 5px 0 #8f1700}.choices .yes{background:var(--green);box-shadow:0 5px 0 #1c5233}
.fb{position:absolute;left:0;right:0;bottom:0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.15);transform:translateY(110%);transition:transform .3s;z-index:20;display:flex;flex-direction:column;gap:10px}
.fb.show{transform:none}.fb .h{font-size:24px}.fb.good .h{color:var(--green)}.fb.bad .h{color:var(--red)}.fb p{font-size:16px;line-height:1.35}
/* round 2 */
.hearts{font-size:22px;letter-spacing:2px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{position:relative;background:#fff;border-radius:16px;padding:6px;border:3px solid transparent;transition:border-color .2s}
.cell .art{aspect-ratio:5/4}
.cell .lb{font-size:12px;text-align:center;color:var(--muted);min-height:2.4em;padding:2px 2px 0;opacity:0}
.cell.found{border-color:var(--red)}.cell.found .lb,.cell.okd .lb,.cell.miss .lb{opacity:1}
.cell.okd{border-color:var(--green)}.cell.miss{border-color:var(--orange)}
.stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(0);padding:2px 10px;border:4px solid var(--red);border-radius:10px;color:var(--red);background:rgba(255,255,255,.9);font-size:20px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.cell.found .stamp,.cell.miss .stamp{transform:translate(-50%,-50%) rotate(-12deg) scale(1)}
.cell.miss .stamp{border-color:var(--orange);color:var(--orange)}
.okmark{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center;font-size:18px}
.cell.okd .okmark{display:flex}
.note{font-size:15px;text-align:center;color:var(--brown);min-height:1.4em}
/* round 3 */
.q{font-size:19px;line-height:1.3;color:var(--brown)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid #ead7c2;border-radius:16px;padding:14px;font-size:16px;line-height:1.3;color:var(--brown)}
.opt.good{border-color:var(--green);background:#e7f4ec}.opt.bad{border-color:var(--red);background:#fdeae4}
.opt[disabled]{cursor:default}
/* result */
.big{font-size:72px;line-height:1;color:var(--red);text-align:center}
.stars{text-align:center;font-size:40px;letter-spacing:6px}
.miss li{list-style:none;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.3}
.miss li b{color:var(--red)}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40}
.toast.show{opacity:1}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function nextOpen(){ /* resume the assessment where it was left */
  if (st.stage === "result") return "result";
  var c = D.cards.every(function(x){ return x.id in st.ans; });
  if (!c) return "r1";
  var a = D.scenes[0].tiles.filter(function(t){return t.risk;}).every(function(t){ return t.id in st.ans; });

  var b = D.scenes[1].tiles.filter(function(t){return t.risk;}).every(function(t){ return t.id in st.ans; });
  if (!b) return "r2b";
  var q = D.scen.every(function(x){ return x.id in st.ans; });

  var lives = 3, done = false;
  var s = el("div",{class:"scr"});
  s.innerHTML = '<div class="roundhd"><h2 class="d">'+U("r2")+'</h2><span class="hearts" id="hp"></span></div><div class="sub">'+U("r2s")+' <b>'+U("scene")+' '+(sceneIdx+1)+' '+U("of")+' 2</b></div><div class="grid" id="g"></div><div class="note d" id="nt"></div><button class="btn d" id="sn" style="display:none">'+U("next")+'</button>';
  main.appendChild(s);
  function hearts(){ $("hp").textContent = "❤️".repeat(lives) + "🤍".repeat(3-lives); }
  tiles.forEach(function(t){
    var c = el("button",{class:"cell","data-id":t.id});
    c.innerHTML = art(t.art) + '<div class="lb">'+tx(t.t)+(t.rule ? ' · '+U("rule")+' '+t.rule : '')+'</div>' + (t.risk ? '<span class="stamp d">NEVER</span>' : '<span class="okmark">✓</span>');
    if (t.risk && t.id in st.ans) c.classList.add(st.ans[t.id] ? "found" : "miss");
    c.onclick = function(){
      if (done || c.classList.contains("found") || c.classList.contains("okd")) return;
      if (t.risk) { c.classList.add("found"); answer(t.id, "found", true); snd("bump", .7); $("nt").textContent = "✓ " + U("found"); }
      else { c.classList.add("okd"); lives--; hearts(); snd("buzzer", .5); $("nt").textContent = "✗ " + U("ok") + " – " + tx(t.t); }
      check();
    };
    $("g").appendChild(c);
  });
  function check(){
    var left = risks.filter(function(t){ return !(t.id in st.ans); });
    if (!left.length || lives <= 0) {
      done = true;
      left.forEach(function(t){ answer(t.id, "missed", false); document.querySelector('.cell[data-id="'+t.id+'"]').classList.add("miss"); });
      $("nt").textContent = left.length ? U("out") : "🎉 " + U("allfound"); if (!left.length) snd("right", .6);
      $("sn").style.display = "block"; $("sn").onclick = function(){ go(nextStage); };
    }
  }
  hearts(); check();
}
R.r2a = function(){ spot(0, "r2b"); };
R.r2b = function(){ spot(1, "r3"); };

/* -------- round 3: what would you do? -------- */
R.r3 = function(){
  var qi = 0; while (qi < D.scen.length && D.scen[qi].id in st.ans) qi++;
  if (qi >= D.scen.length) { go("result"); return; }
  var q = D.scen[qi], opts = shuffle(q.opts.map(function(o,k){ o.k=k; return o; }), 3 + qi + st.tries);
  var s = el("div",{class:"scr"});
  s.innerHTML = '<div class="roundhd"><h2 class="d">'+U("r3")+'</h2><span class="n">'+(qi+1)+' / '+D.scen.length+'</span></div>'
    + '<div style="width:62%;align-self:center">'+art(q.art)+'</div><div class="q d">'+tx(q.q)+'</div><div class="sub">'+U("r3s")+'</div><div id="ops" style="display:flex;flex-direction:column;gap:10px"></div>';
  var fb = el("div",{class:"fb",id:"fb"}); main.appendChild(s); main.appendChild(fb);
  opts.forEach(function(o){
    var b = el("button",{class:"opt"}, tx(o.t));
    b.onclick = function(){
      if (q.id in st.ans) return;
      answer(q.id, "opt"+o.k, !!o.ok);
      document.querySelectorAll(".opt").forEach(function(x, j){ x.disabled = true; if (opts[j].ok) x.classList.add("good"); });
      if (!o.ok) b.classList.add("bad");
      snd(o.ok ? "right" : "buzzer", .6);
      fb.className = "fb show " + (o.ok ? "good" : "bad");
      fb.innerHTML = '<div class="h d">'+(o.ok ? "✓ "+U("right") : "✗ "+U("wrong"))+'</div><p>'+tx(q.why)+'</p><button class="btn d" id="fbn">'+U("cont")+'</button>';
      $("fbn").onclick = function(){ fb.className = "fb"; show("r3"); };
    };
    $("ops").appendChild(b);
  });
};

/* -------- result -------- */
R.result = function(){
  var p = score(), pass = p >= 80;
  if (!st.counted) { st.counted = true; st.tries++; }
  st.best = Math.max(st.best, p); if (pass) st.passed = true;
  sc.set("cmi.core.score.min", "0"); sc.set("cmi.core.score.max", "100"); sc.set("cmi.core.score.raw", String(st.best));
  sc.set("cmi.core.lesson_status", st.passed ? "passed" : "failed"); save();
  var stars = p >= 95 ? 3 : p >= 80 ? 2 : p >= 50 ? 1 : 0;
  var missed = [];
  D.cards.forEach(function(c){ if (st.ans[c.id] === false) missed.push([c.rule, tx(c.t), tx(c.why)]); });
  D.scenes.forEach(function(S){ S.tiles.forEach(function(t){ if (t.risk && st.ans[t.id] === false) missed.push([t.rule, tx(t.t), ""]); }); });
  D.scen.forEach(function(q){ if (st.ans[q.id] === false) missed.push(["", tx(q.q), tx(q.why)]); });
  var s = el("div",{class:"scr"});
  s.innerHTML = '<h2 class="d" style="text-align:center">'+U("result")+'</h2><div class="big d pop">'+p+'%</div><div class="stars">'+"⭐".repeat(stars)+"☆".repeat(3-stars)+'</div>'
    + '<div class="d" style="text-align:center;font-size:20px;color:'+(pass?'var(--green)':'var(--red)')+'">'+U(pass?"passed":"failed")+'</div>'
    + (missed.length ? '<div class="sub d">'+U("review")+'</div><ul class="miss">'+missed.map(function(m){ return '<li>'+(m[0]?'<b>'+U("rule")+' '+m[0]+'</b> · ':'')+m[1]+(m[2]?'<br><span style="color:var(--muted)">'+m[2]+'</span>':'')+'</li>'; }).join("")+'</ul>' : '')
    + (pass ? '<button class="btn d" id="fin">'+U("finish")+'</button>' : '<button class="btn d" id="rt">'+U("retry")+'</button>')
    + '<button class="btn sec d" id="rw">'+U("rewatch")+'</button>';
  main.appendChild(s); snd(pass ? "right" : "buzzer", .6);
  if ($("rt")) $("rt").onclick = function(){ st.ans = {}; st.counted = false; go("r1"); };
  if ($("fin")) $("fin").onclick = function(){ bye(); main.innerHTML = '<div class="scr" style="justify-content:center;text-align:center"><div class="big d">✓</div><h2 class="d">'+U("done")+'</h2></div>'; };
  $("rw").onclick = function(){ go("video"); };
};

D.art.__crown = document.querySelector("header span").innerHTML;
show(st.stage === "result" && !st.passed ? "result" : st.stage);
if (resumed) toast(U("resume"));
}
</script>
